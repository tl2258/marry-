<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>婚礼宾客赴远与相册管理后台</title>
  <link rel="stylesheet" href="./src/style.css">
  <style>
    body {
      overflow-y: auto !important;
      background-color: var(--bg-pearl, #FAF9F7) !important;
      color: var(--text-ink, #332F2E);
      padding: 32px 16px;
      font-family: var(--font-body);
    }
    .admin-container {
      max-width: 960px;
      margin: 0 auto;
      position: relative;
      z-index: 10;
    }
    .admin-card {
      background: var(--surface-card, #FFFFFF);
      border: 1px solid var(--gold-border, #CFC5BC);
      border-radius: var(--radius-lg, 12px);
      padding: 28px 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-ambient, 0 10px 30px -10px rgba(51, 47, 46, 0.08));
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .stat-box {
      background: var(--surface-champagne-light, #F8F1E9);
      border: 1px solid var(--gold-border, #CFC5BC);
      border-radius: var(--radius-md, 8px);
      padding: 18px 16px;
      text-align: center;
    }
    .stat-val {
      font-family: var(--font-display, Georgia, serif);
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--rose-dusty, #7C5454);
    }
    .stat-desc {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted, #7E766E);
      margin-top: 4px;
    }
    .table-wrapper {
      overflow-x: auto;
      margin-top: 16px;
      border-radius: var(--radius-md, 8px);
      border: 1px solid var(--gold-border, #CFC5BC);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
      background: #FFFFFF;
    }
    th, td {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(207, 197, 188, 0.4);
    }
    th {
      color: var(--text-ink, #332F2E);
      background: var(--surface-champagne, #F3E5D8);
      font-weight: 600;
    }
    tr:hover {
      background: rgba(212, 163, 163, 0.08);
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-success { background: rgba(5, 150, 105, 0.1); color: #059669; border: 1px solid rgba(5, 150, 105, 0.3); }
    .badge-danger { background: rgba(220, 38, 38, 0.1); color: #DC2626; border: 1px solid rgba(220, 38, 38, 0.3); }
    
    .btn-admin {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--text-primary, #665D53);
      color: #FFFFFF;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-admin:hover {
      background: var(--rose-dusty, #7C5454);
      transform: translateY(-1px);
    }

    /* 相册管理网格 */
    .gallery-manage-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .gallery-manage-item {
      background: var(--bg-pearl-bright, #FCFBF9);
      border: 1px solid var(--gold-border, #CFC5BC);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 4px 12px rgba(51, 47, 46, 0.03);
    }
    .gallery-manage-thumb {
      width: 100%;
      aspect-ratio: 4/5;
      border-radius: 8px;
      object-fit: cover;
      margin-bottom: 8px;
      border: 1px solid var(--gold-border);
    }
    .upload-photo-btn {
      background: var(--rose-dusty, #7C5454);
      color: #FFFFFF;
      border: none;
      padding: 8px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      width: 100%;
      margin-top: 4px;
      transition: background 0.2s ease;
    }
    .upload-photo-btn:hover {
      background: var(--text-primary);
    }
    .upload-file-input { display: none; }

    /* 登录 Overlay */
    .login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(250, 249, 247, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <!-- 丝绸暗纹微光蒙层 -->
  <div class="silk-texture"></div>

  <!-- 登录密码 Modal -->
  <div id="login-overlay" class="login-overlay">
    <div class="admin-card" style="max-width: 380px; width: 100%; text-align: center;">
      <div class="text-label-caps">SECURITY ACCESS</div>
      <h2 style="font-family: var(--font-display); font-size: 1.5rem; color: var(--text-ink); margin-bottom: 20px;">后台管理验证</h2>
      <div class="form-group" style="text-align: left;">
        <label class="form-label">请输入管理员密码</label>
        <input type="password" id="admin-pass-input" class="form-input" placeholder="默认密码: admin">
      </div>
      <button id="login-btn" class="btn-admin" style="width: 100%; margin-top: 20px; padding: 12px;">
        <span>🔓 解锁登录后台</span>
      </button>
      <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 14px;">密码可在 src/config.js 中自设置修改</p>
    </div>
  </div>

  <!-- 后台主界面 -->
  <div class="admin-container">
    <div class="admin-card" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
      <div>
        <div class="text-label-caps">ADMINISTRATION PANEL</div>
        <h1 style="font-family: var(--font-display); font-size: 1.6rem; color: var(--text-ink); margin-top: 4px;">💒 婚礼宾客赴约与相册管理后台</h1>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">实时数据汇总、全量 Excel 导出与相册动态管理</p>
      </div>
      <div style="display: flex; gap: 12px;">
        <button id="export-excel-btn" class="btn-admin">
          <span>📊 导出 Excel 表格</span>
        </button>
        <a href="./index.html" class="btn-admin" style="background: var(--surface-champagne); color: var(--text-ink); border: 1px solid var(--gold-border);">
          <span>返回 H5 请帖</span>
        </a>
      </div>
    </div>

    <!-- 统计看板 -->
    <div class="admin-card">
      <h3 style="color: var(--text-ink); font-family: var(--font-display); font-size: 1.2rem;">📊 出席数据实时汇总</h3>
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-val" id="stat-total-people">0</div>
          <div class="stat-desc">确认出席总人数</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="stat-tables-est">0</div>
          <div class="stat-desc">预估宴会桌数 (10人/桌)</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="stat-total-records">0</div>
          <div class="stat-desc">已提交回复户数</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="stat-absent-count" style="color: var(--text-muted);">0</div>
          <div class="stat-desc">遗憾无法出席户数</div>
        </div>
      </div>
    </div>

    <!-- 婚纱照与“定格瞬间”在线相册管理卡片 -->
    <div class="admin-card">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px;">
        <div>
          <h3 style="color: var(--text-ink); font-family: var(--font-display); font-size: 1.2rem;">🖼️ 婚纱照与“定格瞬间”相册在线管理</h3>
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">可在后台实时更换主页【定格瞬间】展现的 9 张婚纱照，实时生效！</p>
        </div>
        <button id="reset-gallery-btn" class="btn-admin" style="background: var(--surface-champagne); color: var(--text-ink); border: 1px solid var(--gold-border); font-size: 0.78rem; padding: 6px 14px;">
          🔄 恢复初始相册
        </button>
      </div>

      <div id="gallery-manage-grid" class="gallery-manage-grid">
        <!-- 动态渲染照片管理列表 -->
      </div>
    </div>

    <!-- 数据列表 -->
    <div class="admin-card">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
        <h3 style="color: var(--text-ink); font-family: var(--font-display); font-size: 1.2rem;">📝 宾客回复明细表</h3>
        <input type="text" id="search-input" class="form-input" placeholder="搜索姓名/电话..." style="width: 220px; padding: 8px 14px; font-size: 0.85rem;">
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>姓名</th>
              <th>出席状态</th>
              <th>人数</th>
              <th>联系电话</th>
              <th>祝福留言</th>
              <th>提交时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="guest-table-body">
            <!-- 动态渲染 -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="./src/admin.js"></script>
</body>
</html>
